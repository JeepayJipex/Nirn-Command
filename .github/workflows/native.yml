name: Native catalog
on: [push, pull_request, workflow_dispatch]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test palette and editor
        run: |
          node tests/search.test.js
          node tests/heartbeat.test.js
          node tests/categories.test.js
          node tests/palette.test.js
          node tests/editor.test.js
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Pin vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout 9e593bb18ea69cc5095e012465dcd675a822ed0d
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
      - name: Cache vcpkg packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/build/native/vcpkg_installed
          key: native-vcpkg-${{ runner.os }}-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json', 'native/vcpkg-ports/**') }}
          restore-keys: native-vcpkg-${{ runner.os }}-
      - name: Configure
        shell: pwsh
        run: |
          cmake -S native -B build/native -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save vcpkg packages
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build/native/vcpkg_installed
          key: native-vcpkg-${{ runner.os }}-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json', 'native/vcpkg-ports/**') }}
      - name: Build
        shell: pwsh
        run: |
          cmake --build build/native --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test discovery
        shell: pwsh
        run: |
          ctest --test-dir build/native -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect dependency licenses
        shell: pwsh
        run: |
          $share = Join-Path $PWD 'build/native/vcpkg_installed/x64-windows-static/share'
          $licenses = Join-Path $PWD 'build/native/licenses'
          foreach ($file in Get-ChildItem -LiteralPath $share -Filter copyright -Recurse) {
            $name = $file.Directory.Name
            $dest = Join-Path $licenses $name
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $dest 'copyright')
          }
          if (!(Test-Path -LiteralPath (Join-Path $licenses 'commonlibsse-ng/copyright'))) { throw 'CommonLib license missing' }
      - name: Upload DLL and Papyrus source
        uses: actions/upload-artifact@v4
        with:
          name: NirnCommandNative
          path: |
            build/native/Release/NirnCommandNative.dll
            Scripts/Source/NirnCommandNative.psc
            build/native/licenses
          if-no-files-found: error
